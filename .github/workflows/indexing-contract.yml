name: Indexing Contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-indexing-contract:
    name: Validate static indexing contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run indexing contract regression tests
        run: python3 scripts/test_indexing_contract.py

      - name: Install essay builder test dependencies
        run: python3 -m pip install PyYAML Jinja2

      - name: Run Spanish publication, metadata, and renderer regressions
        run: python3 scripts/test_es_text.py

      - name: Validate canonical, hreflang, sitemap, and links
        run: python3 scripts/validate_indexing_contract.py

      # GM 2026-09-29: gate 60 renewed essays plus the Founder’s pristine essay.
      - name: Audit all Spanish text (remaining editorial backlog)
        continue-on-error: true
        run: python3 scripts/validate_es_text.py

      - name: Gate renewed Spanish essays (60)
        run: >-
          python3 scripts/validate_es_text.py --pages
          el-caso-de-los-derechos-de-la-ia
          tus-pensamientos-no-son-tuyos
          la-muerte-de-la-experiencia
          ya-eres-un-cyborg
          los-tres-futuros
          que-significaria-que-muriera-una-ia
          velocidad-de-escape
          como-leer-en-la-era-de-la-distraccion
          por-que-antropomorfizamos-la-ia
          el-problema-de-preguntar-si-la-ia-puede-sentir
          quien-es-responsable-cuando-la-ia-mata
          por-que-las-empresas-son-personas
          un-dia-en-el-mindkind-estratificado
          sobre-escribir-con-maquinas
          como-suena-la-ficcion-ia
          el-ultimo-pensamiento-humano
          por-que-los-escritores-estan-mas-enfadados
          la-economia-de-influencers-es-un-adelanto
          que-acerto-her-sobre-el-amor-con-ia
          a-favor-de-desconectarse-a-veces
          que-decirles-a-tus-hijos-sobre-ia
          cuando-confiar-en-la-ia
          la-verdadera-razon-no-puedes-concentrarte
          pensar-claridad-era-ia
          espectro-de-ia
          la-economia-de-la-atencion-devoro-tus-deseos
          la-nueva-brecha-digital
