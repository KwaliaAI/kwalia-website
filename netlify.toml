[build]
  publish = "."
  edge_functions = "netlify/edge-functions"

[[edge_functions]]
  function = "google-fetch-auth"
  path = "/fetch/*"

[[edge_functions]]
  function = "tracking-query-cleanup"
  path = "/"

[[headers]]
  for = "/fetch/*"

  [headers.values]
    Cache-Control = "no-store, no-cache, max-age=0, must-revalidate"
    Expires = "0"
    Pragma = "no-cache"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/assets/*.pdf"

  [headers.values]
    X-Robots-Tag = "noindex"
